<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 // AMAN.SYS</title>
     <link rel="icon" type="image/png" href="assets/favicon.png?v=2">
    
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        /* --- EXCLUSIVE 404 GLITCH ANIMATION --- */
        .error-glitch {
            position: relative;
            color: var(--text);
            font-size: clamp(6rem, 15vw, 12rem);
            font-family: 'Koulen', sans-serif;
            margin-bottom: 10px;
            line-height: 1;
            animation: rgb-shift 2s infinite alternate;
        }
        
        .error-glitch::before, .error-glitch::after {
            content: '404';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
        }
        
        /* Red Glitch Layer */
        .error-glitch::before {
            left: 4px;
            text-shadow: -3px 0 #ff003c;
            clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
            animation: glitch-top 0.8s infinite linear alternate-reverse;
        }
        
        /* Cyan Glitch Layer */
        .error-glitch::after {
            left: -4px;
            text-shadow: 3px 0 var(--accent);
            clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
            animation: glitch-bottom 1.2s infinite linear alternate-reverse;
        }

        @keyframes glitch-top {
            0% { transform: translate(0); }
            20% { transform: translate(-3px, 2px); }
            40% { transform: translate(-3px, -2px); }
            60% { transform: translate(3px, 2px); }
            80% { transform: translate(3px, -2px); }
            100% { transform: translate(0); }
        }
        
        @keyframes glitch-bottom {
            0% { transform: translate(0); }
            20% { transform: translate(3px, -2px); }
            40% { transform: translate(3px, 2px); }
            60% { transform: translate(-3px, -2px); }
            80% { transform: translate(-3px, 2px); }
            100% { transform: translate(0); }
        }
        
        @keyframes rgb-shift {
            0% { text-shadow: 3px 0px 5px rgba(0, 243, 255, 0.4); }
            100% { text-shadow: -3px 0px 5px rgba(255, 0, 60, 0.4); }
        }
    </style>
</head>
<body data-theme="dark" style="display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden;">

    <script>
        (function() {
            var localTheme = localStorage.getItem('portfolio-theme');
            if (localTheme) { document.body.setAttribute('data-theme', localTheme); }
        })();
    </script>

    <div id="cursor"></div>
    <div id="cursor-follower"></div>

    <div class="bg-grid"></div>
    <div class="noise-overlay"></div>

    <div style="text-align: center; z-index: 10;">
        <div class="error-glitch">404</div>
        
        <p class="terminal-text" style="font-size: 1.5rem; color: var(--accent); margin-bottom: 40px;">
            > SYSTEM ERROR: DATA NOT FOUND
        </p>
        
        <a href="index.html" class="cyber-btn">
            RETURN TO HQ
        </a>
    </div>

    <script src="script.js"></script>

</body>
</html>
