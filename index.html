<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aman Udewal - Intro</title>
    
    <!-- Core Portfolio CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="intro.css">
    
    <!-- Portfolio Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
</head>
<body data-theme="dark">

    <!-- Same Three.js Canvas as Portfolio -->
    <canvas id="webgl-canvas"></canvas>
    
    <!-- Background Grid & Noise -->
    <div class="bg-grid"></div>
    <div class="noise-overlay"></div>

    <!-- Custom Cursor -->
    <div id="cursor"></div>
    <div id="cursor-follower"></div>

    <div class="intro-screen">
        
        <!-- Left Side: Content -->
        <div class="intro-content">
            <!-- Dynamic Typing Sub Text -->
            <div class="meta-tag stagger-elem" style="justify-content: flex-start; min-height: 25px; align-items: center; display: flex;">
                <span style="color: var(--secondary-text); margin-right: 8px;">//</span>
                <span id="typewriter-text" style="color: var(--accent); font-weight: bold; letter-spacing: 1px;"></span>
                <span class="blinking-cursor"></span>
            </div>
            
            <div class="hero-title-wrapper stagger-elem" style="margin-bottom: 30px;">
                <div class="hero-title-gradient-bg"></div>
                <!-- Added periodic glitch animation class -->
                <h1 class="glitch-title massive-title periodic-glitch">
                    AMAN <br>
                    <span class="hollow">UDEWAL</span>
                </h1>
            </div>
            
            <!-- Terminal Typing Box -->
            <div class="interactive-terminal stagger-elem" style="width: 100%; max-width: 450px; min-height: 160px; overflow: hidden; margin-bottom: 40px; text-align: left;">
                <div id="cli-output" style="color: var(--secondary-text); line-height: 1.6;">
                    <!-- Content will be typed out via JS -->
                </div>
            </div>
            
            <button class="cyber-btn enter-btn" style="opacity: 1 !important; visibility: visible !important; display: block !important; z-index: 9999;">
                <span class="btn-text">INITIALIZE PROGRAM</span>
                <span class="btn-glitch"></span>
            </button>
        </div>

        <!-- Right Side: Model -->
        <div class="intro-visual stagger-model">
            <!-- Sleek Loading State -->
            <div id="model-loader" class="scanning-loader">
                <div class="spinner"></div>
                <div>SCANNING ASSETS...</div>
            </div>

            <div class="scanner-frame">
                <!-- Glowing Hologram Base -->
                <div class="holo-base"></div>
                <model-viewer 
                    src="assets/model.glb" 
                    shadow-intensity="1.5" 
                    shadow-softness="1"
                    tone-mapping="aces"
                    exposure="1.2"
                    environment-image="neutral"
                    autoplay
                    animation-name="Idle"
                    field-of-view="30deg"
                    class="model-avatar"
                ></model-viewer>
            </div>
            <div class="model-caption">
                FIG 1.0: AMAN UDEWAL
            </div>
        </div>

    </div>

    <script>
        // --- 1. EXACT THREE.JS PARTICLES FROM PORTFOLIO ---
        function initThreeJS() {
            const canvas = document.getElementById('webgl-canvas');
            if (!canvas || typeof THREE === 'undefined') return;

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);

            const particlesGeometry = new THREE.BufferGeometry();
            const particlesCount = 800; // Exact density from portfolio
            const posArray = new Float32Array(particlesCount * 3);

            for(let i = 0; i < particlesCount * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 5; 
            }

            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            
            const material = new THREE.PointsMaterial({ size: 0.005, color: 0xffffff, transparent: true, opacity: 0.5 });
            const particlesMesh = new THREE.Points(particlesGeometry, material);
            scene.add(particlesMesh);

            camera.position.z = 2;

            let mouseX = 0;
            let mouseY = 0;
            document.addEventListener('mousemove', (event) => {
                mouseX = event.clientX / window.innerWidth - 0.5;
                mouseY = event.clientY / window.innerHeight - 0.5;
            });

            const animate = () => {
                requestAnimationFrame(animate);
                particlesMesh.rotation.y += 0.001;
                
                if (typeof gsap !== "undefined") {
                    gsap.to(particlesMesh.rotation, {
                        x: -mouseY * 0.5,
                        y: mouseX * 0.5,
                        duration: 2
                    });
                }
                
                const currentAccent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
                if(currentAccent) material.color.set(currentAccent);

                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
        initThreeJS();

        // --- 2. CUSTOM CURSOR ---
        const cursor = document.getElementById('cursor');
        const cursorFollower = document.getElementById('cursor-follower');
        if (cursor && cursorFollower) {
            gsap.set(cursor, { xPercent: -50, yPercent: -50 });
            gsap.set(cursorFollower, { xPercent: -50, yPercent: -50 });
            let cursorX = gsap.quickTo(cursor, "x", {duration: 0.05, ease: "power3"});
            let cursorY = gsap.quickTo(cursor, "y", {duration: 0.05, ease: "power3"});
            let followerX = gsap.quickTo(cursorFollower, "x", {duration: 0.4, ease: "power3"});
            let followerY = gsap.quickTo(cursorFollower, "y", {duration: 0.4, ease: "power3"});
            
            // 3D Parallax QuickTo variables
            let titleX = gsap.quickTo('.hero-title-wrapper', "x", {duration: 0.5, ease: "power3"});
            let titleY = gsap.quickTo('.hero-title-wrapper', "y", {duration: 0.5, ease: "power3"});
            let titleRotX = gsap.quickTo('.hero-title-wrapper', "rotateX", {duration: 0.5, ease: "power3"});
            let titleRotY = gsap.quickTo('.hero-title-wrapper', "rotateY", {duration: 0.5, ease: "power3"});
            
            document.addEventListener('mousemove', (e) => {
                cursorX(e.clientX);
                cursorY(e.clientY);
                followerX(e.clientX);
                followerY(e.clientY);

                // 3D Text Parallax Effect
                const normX = (e.clientX / window.innerWidth) - 0.5;
                const normY = (e.clientY / window.innerHeight) - 0.5;
                titleX(normX * -30);
                titleY(normY * -30);
                titleRotX(normY * 15);
                titleRotY(normX * -15);
            });

            const interactables = document.querySelectorAll('.cyber-btn');
            interactables.forEach(el => {
                el.addEventListener('mouseenter', () => {
                    gsap.to(cursorFollower, { width: 60, height: 60, backgroundColor: 'rgba(0, 243, 255, 0.1)', duration: 0.3 });
                    gsap.to(cursor, { scale: 0, duration: 0.2 }); 
                });
                el.addEventListener('mouseleave', () => {
                    gsap.to(cursorFollower, { width: 40, height: 40, backgroundColor: 'transparent', duration: 0.3 });
                    gsap.to(cursor, { scale: 1, duration: 0.2 }); 
                });
            });
        }

        // --- 3. ENTRANCE ANIMATIONS ---
        const tl = gsap.timeline();
        tl.from('.stagger-model', { opacity: 0, scale: 0.9, duration: 1.5, ease: "power3.out", x: 50 })
          .from('.stagger-elem', { y: 40, opacity: 0, duration: 1, stagger: 0.2, ease: "power3.out" }, "-=1");

        // --- 4. DYNAMIC SUB TEXT TYPEWRITER ---
        const roles = ["APP DEVELOPER", "SOFTWARE ENGINEER", "PYTHON DEVELOPER", "AI ENGINEER"];
        let roleIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        const typeTarget = document.getElementById("typewriter-text");

        function typeWriterRole() {
            const currentRole = roles[roleIndex];
            
            if (isDeleting) {
                typeTarget.textContent = currentRole.substring(0, charIndex - 1);
                charIndex--;
            } else {
                typeTarget.textContent = currentRole.substring(0, charIndex + 1);
                charIndex++;
            }

            let typeSpeed = isDeleting ? 40 : 100;

            if (!isDeleting && charIndex === currentRole.length) {
                typeSpeed = 2500; // Pause at end of word
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                roleIndex = (roleIndex + 1) % roles.length;
                typeSpeed = 500; // Pause before new word
            }

            setTimeout(typeWriterRole, typeSpeed);
        }
        // Start role typing after entrance animation
        setTimeout(typeWriterRole, 1500);

        // --- 5. DYNAMIC TERMINAL TYPEWRITER ---
        const terminalLines = [
            "> SYSTEM_BOOT_SEQUENCE",
            "> INITIALIZING_ENVIRONMENT",
            "> LOADING_ASSETS: OK",
            "> STATUS: ONLINE",
            "> WAITING FOR USER INPUT_"
        ];
        const terminalTarget = document.getElementById('cli-output');
        let termLine = 0;
        let termChar = 0;

        function typeTerminal() {
            if (termLine < terminalLines.length) {
                if (termChar === 0) {
                    terminalTarget.innerHTML += `<div id="line-${termLine}"></div>`;
                }
                
                const currentLineStr = terminalLines[termLine];
                // Handle HTML spans if we wanted colors, but plain text is fine here
                document.getElementById(`line-${termLine}`).textContent += currentLineStr.charAt(termChar);
                termChar++;
                
                if (termChar >= currentLineStr.length) {
                    termChar = 0;
                    termLine++;
                    setTimeout(typeTerminal, 400); // Pause between lines
                } else {
                    setTimeout(typeTerminal, 25); // Speed of character typing
                }
            }
        }
        setTimeout(typeTerminal, 1800);

        // --- 6. 3D MODEL LOADER HANDLING ---
        const viewer = document.querySelector('model-viewer');
        const loader = document.getElementById('model-loader');
        viewer.addEventListener('load', () => {
            gsap.to(loader, { opacity: 0, duration: 0.5, onComplete: () => loader.style.display = 'none' });
            gsap.to(viewer, { opacity: 1, duration: 1 });
        });

        // --- 7. AUDIO EFFECTS (Real Audio Assets) ---
        const hoverSound = new Audio('assets/Hover.wav');
        hoverSound.volume = 0.5; // Adjust volume as needed
        
        const clickSound = new Audio('assets/click.mp3');
        clickSound.volume = 0.8;
        
        // Browsers block audio until the first interaction. Unlock it anywhere on click.
        document.body.addEventListener('click', () => {
            // This empty listener satisfies some mobile browsers' requirements
        }, { once: true });

        function playHoverSound() {
            hoverSound.currentTime = 0; // Rewind to start for rapid hovering
            hoverSound.play().catch(e => console.log('Audio play blocked until click', e));
        }

        function playClickSound() {
            clickSound.currentTime = 0;
            clickSound.play().catch(e => console.log('Audio play blocked until click', e));
        }

        const enterBtn = document.querySelector('.enter-btn');
        enterBtn.addEventListener('mouseenter', playHoverSound);

        // --- 8. CRT TURN-OFF TRANSITION ---
        enterBtn.addEventListener('click', (e) => {
            e.preventDefault();
            playClickSound();
            
            // Fade out background canvas first
            gsap.to('#webgl-canvas', { opacity: 0, duration: 0.2 });
            
            // CRT Screen collapse effect
            const screen = document.querySelector('.intro-screen');
            const transitionTl = gsap.timeline({
                onComplete: () => {
                    console.log("INITIALIZE PROGRAM clicked! Routing to main portfolio.");
                    window.location.href = 'portfolio.html?skipIntro=true';
                }
            });
            
            transitionTl
                .to(screen, { scaleY: 0.01, duration: 0.25, ease: "power2.in" })
                .to(screen, { scaleX: 0, duration: 0.25, ease: "power2.out" })
                .to(document.body, { backgroundColor: "#000", duration: 0.1 }, "-=0.1");
        });
    </script>
</body>
</html>
